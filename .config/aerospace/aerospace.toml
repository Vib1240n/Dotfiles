# Twitter Settings

[[on-window-detected]]
if.app-id = 'com.atebits.Tweetie2'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.Music'
run = ['layout tiling', 'move-node-to-workspace S']

[[on-window-detected]]
if.window-title-regex-substring = 'MiniPlayer'
if.app-id = 'com.apple.Music'
run = ['layout floating']
[[on-window-detected]]
if.window-title-regex-substring = 'Equalizer'
if.app-id = 'com.apple.Music'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'app.legcord.Legcord'
run = ['layout tiling', 'move-node-to-workspace D']

[[on-window-detected]]
if.window-title-regex-substring = 'Alfred Preferences'
if.app-id = 'com.runningwithcrayons.Alfred-Preferences'
run = ['layout floating']


