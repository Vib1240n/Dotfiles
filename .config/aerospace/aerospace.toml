# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

# You can use it to add commands that run after login to macOS user session.
# 'start-at-login' needs to be 'true' for 'after-login-command' to work
# Available commands: https://nikitabobko.github.io/AeroSpace/commands
after-login-command = []

# You can use it to add commands that run after AeroSpace startup.
# 'after-startup-command' is run after 'after-login-command'
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = [
    'exec-and-forget borders active_color=0xFFE6E6E6 inactive_color=0xff494d64 width=1.5',

]

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
# on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
# on-focus-changed = ['move-mouse window-lazy-center']
# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = false

# Possible values: (qwerty|dvorak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 10
outer.bottom = 10
outer.top = 10
outer.right = 10

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]

# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
#                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
#                   backspace, tab
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right

# All possible modifiers: cmd, alt, ctrl, shift

# All possible commands: https://nikitabobko.github.io/AeroSpace/commands

# See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
# You can uncomment the following lines to open up terminal with alt + enter shortcut
# (like in i3)
# alt-enter = '''exec-and-forget osascript -e '
# tell application "Terminal"
#     do script
#     activate
# end tell'
# '''

# See: https://nikitabobko.github.io/AeroSpace/commands#layout
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# See: https://nikitabobko.github.io/AeroSpace/commands#focus
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# See: https://nikitabobko.github.io/AeroSpace/commands#move
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# See: https://nikitabobko.github.io/AeroSpace/commands#resize
# See: https://nikitabobko.github.io/AeroSpace/commands#workspace
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-z = 'workspace Z'
alt-d = 'workspace D'
alt-t = 'workspace T'
alt-f = 'workspace F'
alt-b = 'workspace B'
alt-w = 'workspace W'
alt-e = 'workspace E'
alt-p = 'workspace P'
alt-o = 'workspace O'
# See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
alt-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
alt-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
alt-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
alt-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
alt-shift-9 = ['move-node-to-workspace 9', 'workspace 9']
alt-shift-z = ['move-node-to-workspace Z', 'workspace Z']
alt-shift-d = ['move-node-to-workspace D', 'workspace D']
alt-shift-t = ['move-node-to-workspace T', 'workspace T']
alt-shift-f = ['move-node-to-workspace F', 'workspace F']
alt-shift-b = ['move-node-to-workspace B', 'workspace B']
alt-shift-w = ['move-node-to-workspace W', 'workspace W']
alt-shift-e = ['move-node-to-workspace E', 'workspace E']
alt-shift-p = ['move-node-to-workspace P', 'workspace P']
alt-shift-o = ['move-node-to-workspace O', 'workspace O']

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
alt-tab = 'workspace-back-and-forth'
# See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'
alt-shift-space = 'focus-monitor prev'
alt-space = 'focus-monitor next'
# See: https://nikitabobko.github.io/AeroSpace/commands#mode
alt-shift-semicolon = 'mode service'
alt-shift-r = 'mode resize'
alt-shift-period = 'mode open'
alt-shift-backspace = 'mode pass'
# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = [
    'layout floating tiling',
    'mode main',
] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current --quit-if-last-window', 'mode main']

# sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
#s = ['layout sticky tiling', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']
down = 'volume down'
up = 'volume up'
shift-down = ['volume set 0', 'mode main']

[mode.resize.binding]
h = ['resize width -50']
l = ['resize width +50']
f = ['fullscreen', 'mode main']
j = ['resize height -50']
k = ['resize height +50']
esc = 'mode main'
b = ['balance-sizes', 'mode main']


[[on-window-detected]]
if.app-id = 'com.bambulab.bambu-studio'
run = ['move-node-to-workspace B']


[workspace-to-monitor-force-assignment]
1 = 'main'
3 = 'main'
5 = 'main'
7 = 'main'
2 = 'secondary'
4 = 'secondary'
6 = 'secondary'
8 = 'secondary'

# Finder window setting
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = ['layout floating']


# Raycast window setting

[[on-window-detected]]
if.app-id = 'com.raycast.macos'
run = ['layout floating']


# Zoom window setting

[[on-window-detected]]
if.app-id = 'us.zoom.xos'
run = ['layout floating']


# Messages window setting

[[on-window-detected]]
if.app-id = 'com.apple.MobileSMS'
run = ['layout floating']


# Preview window setting

[[on-window-detected]]
if.app-id = 'com.apple.Preview'
run = ['layout floating']


# Fusion360 window setting

[[on-window-detected]]
if.app-id = 'com.autodesk.fusion360'
run = ['layout floating', 'move-node-to-workspace F']


# System Preferences window setting

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = ['layout floating']


# TickTick window setting

[[on-window-detected]]
if.app-id = 'com.TickTick.task.mac'
run = ['layout floating', 'move-node-to-workspace E']


# Apple Home window setting

[[on-window-detected]]
if.app-id = 'com.apple.Home'
run = ['layout floating']


# Apple Mail window setting

[[on-window-detected]]
if.app-id = 'com.apple.mail'
run = ['layout floating']


# istatmenus-setapp window setting

[[on-window-detected]]
if.app-id = 'com.bjango.istatmenus-setapp'
run = ['layout floating']

# Obsidian window setting


[[on-window-detected]]
if.app-id = 'md.obsidian'
run = ['move-node-to-workspace O']


# Discord Settings

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = ['move-node-to-workspace D']


# Zen browser Setting

[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
run = ['move-node-to-workspace Z']
# check-further-callback = true


[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
if.window-title-regex-substring = 'Picture-in-Picture'
run = ['layout floating']


# Wezterm Settings

[[on-window-detected]]
if.app-id = 'com.github.wez.wezterm'
run = ['move-node-to-workspace T']

[[on-window-detected]]
if.app-id = 'com.IdeaPunch.ColorSlurp'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.bresink.system.tinkertool'
run = ['layout floating']


[mode.open.binding]
w = ['exec-and-forget open -a /Applications/WezTerm.app', 'mode main']
o = ['exec-and-forget open -a /Applications/Obsidian.app', 'mode main']
z = ['exec-and-forget open -a /Applications/Zen Browser.app', 'mode main']


[mode.pass.binding]
esc = 'mode main'
enter = 'mode main'
