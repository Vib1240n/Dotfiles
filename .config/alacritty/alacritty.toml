[general]
live_config_reload = true
#######################################################################
[window]
decorations = "Buttonless"
blur = true
# startup_mode = "Buttonless"
dynamic_title = true
dynamic_padding = true
opacity = 0.5
padding.x = 20
padding.y = 40
option_as_alt = "None"
#######################################################################
[env]
TERM = "xterm-256color"
#######################################################################
[font]
size = 18
normal.family = "JetBrainsMono Nerd Font"
normal.style = "Regular"
builtin_box_drawing = false
#######################################################################
[scrolling]
history = 100000
#######################################################################
[cursor]
style.shape = "Underline"
style.blinking = "On"
blink_interval = 200
unfocused_hollow = false
#######################################################################
[terminal]
osc52 = "CopyPaste"
#######################################################################
[mouse]
hide_when_typing = true
#######################################################################
[colors]
selection = { text = "CellForeground", background = "#171717" }
# primary = {background = "#000000"}
